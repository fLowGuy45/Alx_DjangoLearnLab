{% extends "base.html" %}
{% block content %}
<h1>Search Results for "{{ query }}"</h1>

{% for post in results %}
  <div>
    <h2><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2>
    <p>{{ post.content|truncatechars:100 }}</p>
  </div>
{% empty %}
  <p>No posts found.</p>
{% endfor %}
{% endblock %}
