{% extends "base.html" %}
{% block content %}
<h1>Posts tagged with "{{ view.tag }}"</h1>

{% for post in posts %}
  <div>
    <h2><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2>
    <p>{{ post.content|truncatechars:100 }}</p>
  </div>
{% empty %}
  <p>No posts with this tag.</p>
{% endfor %}
{% endblock %}
