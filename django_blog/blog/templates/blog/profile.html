{% extends "blog/base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1>{{ request.user.username }}'s Profile</h1>
<p>Email: {{ request.user.email }}</p>
{% if profile.avatar %}
  <img src="{{ profile.avatar.url }}" alt="avatar" style="max-width:200px;max-height:200px;">
{% endif %}
<p>Bio: {{ profile.bio|default:"(no bio)" }}</p>
<a href="{% url 'blog:profile_edit' %}">Edit profile</a>
{% endblock %}
