<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Django Blog{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <nav>
    {% if user.is_authenticated %}
      Hello {{ user.username }} | <a href="{% url 'blog:profile' %}">Profile</a> | <a href="{% url 'blog:logout' %}">Logout</a>
    {% else %}
      <a href="{% url 'blog:login' %}">Login</a> | <a href="{% url 'blog:register' %}">Register</a>
    {% endif %}
  </nav>
  <div class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
